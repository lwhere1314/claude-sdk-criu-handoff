[project]
name = "harbor-resume"
version = "0.1.0"
description = "CRIU-snapshot & resume a Harbor (Terminal-Bench) run by run-id, with an optional model override."
requires-python = ">=3.11"
dependencies = [
  # The stock Harbor harness we wrap. The custom agent/environment subclass
  # Harbor's own Codex agent and Docker environment, so they must match.
  "harbor",
]

[project.scripts]
harbor-resume = "harbor_resume.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
